name: zotero
on:
  workflow_call:
    inputs:
      commit:
        description: Packaging commit to build
        required: true
        type: string
    secrets:
      COPR_CLI_CONFIG:
        required: true
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - zotero/**

jobs:
  copr:
    name: copr
    runs-on: ubuntu-latest
    steps:
      - name: Setup
        run: |
          pip3 install -I copr-cli==1.105
      - name: Login
        run: |
          copr-cli --config <(echo "${COPR_CLI_CONFIG}") whoami
        env:
          COPR_CLI_CONFIG: ${{secrets.COPR_CLI_CONFIG}}
      - name: Build
        id: build
        run: |
          copr-cli --config <(echo "${COPR_CLI_CONFIG}") buildscm --clone-url "https://github.com/${{github.repository}}" --commit "${BUILD_COMMIT}" --subdir "${BUILD_DIR}" --spec "${BUILD_PACKAGE}.spec" --type git --method rpkg "${BUILD_REPO}" | sed -n 's/^Created builds: /build_id=/p' | tr -d ',' >> "${GITHUB_OUTPUT}"
        env:
          BUILD_COMMIT: ${{ inputs.commit || github.sha }}
          COPR_CLI_CONFIG: ${{secrets.COPR_CLI_CONFIG}}
          BUILD_REPO: el-file4138/zotero
          BUILD_DIR: zotero
          BUILD_PACKAGE: zotero
