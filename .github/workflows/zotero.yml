name: zotero
on:
  workflow_call:
    inputs:
      commit:
        description: Packaging commit to build
        required: true
        type: string
    secrets:
      COPR_CLI_CONFIG:
        required: true
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - zotero/**
      - .github/workflows/zotero.yml

permissions:
  contents: read

jobs:
  copr:
    name: copr
    runs-on: ubuntu-latest
    steps:
      - name: Setup
        run: |
          pip3 install -I copr-cli==1.105
      - name: Login
        run: |
          copr-cli --config <(echo "${COPR_CLI_CONFIG}") whoami
        env:
          COPR_CLI_CONFIG: ${{secrets.COPR_CLI_CONFIG}}
      - name: Build
        id: build
        shell: bash
        run: |
          set -euo pipefail
          config=$(mktemp)
          trap 'rm -f "$config"' EXIT
          chmod 600 "$config"
          printf '%s' "$COPR_CLI_CONFIG" > "$config"
          output=$(copr-cli --config "$config" buildscm --clone-url "https://github.com/${GITHUB_REPOSITORY}" --commit "$BUILD_COMMIT" --subdir "$BUILD_DIR" --spec "$BUILD_PACKAGE.spec" --type git --method rpkg "$BUILD_REPO")
          printf '%s\n' "$output"
          ids=$(printf '%s\n' "$output" | sed -n 's/^Created builds: //p' | tr ',' ' ')
          [[ "$ids" =~ ^[[:space:]]*[0-9]+([[:space:]]+[0-9]+)*[[:space:]]*$ ]] || { echo 'Copr returned no valid build IDs' >&2; exit 1; }
          echo "build_id=$ids" >> "$GITHUB_OUTPUT"
          read -r -a builds <<< "$ids"
          copr-cli --config "$config" watch-build "${builds[@]}"
        env:
          BUILD_COMMIT: ${{ inputs.commit || github.sha }}
          COPR_CLI_CONFIG: ${{secrets.COPR_CLI_CONFIG}}
          BUILD_REPO: el-file4138/zotero
          BUILD_DIR: zotero
          BUILD_PACKAGE: zotero
